name: Exact isolated candidate audit (NO DEPLOY)
on:
  push:
    branches: [ci/isolation-fixtures-20261118]
    paths:
      - .github/workflows/isolation-candidate.yml
      - isolation-ci/tests/verify_candidate.py
      - isolation-ci/preview-bootstrap.js
      - isolation-ci/tests/route_shell_qa.py
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned public application
        uses: actions/checkout@v4
        with:
          repository: pc007ya/Learning_Planet
          ref: 0e39222ba892fbc823a884bad636cfb484501169
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full checks and clean build
        working-directory: source
        run: |
          npm ci --ignore-scripts
          cat > /tmp/lp-offline-build.sh <<'BUILD'
          set -e
          ip link set lo up
          npm rebuild --offline
          mv node_modules/.bin/vitest node_modules/.bin/vitest.original
          printf '%s\n' '#!/bin/sh' 'exec node "$(dirname "$0")/../vitest/vitest.mjs" "$@" --maxWorkers=2 --no-file-parallelism' > node_modules/.bin/vitest
          chmod +x node_modules/.bin/vitest
          python3 scripts/patch-ipad-ux.py
          python3 scripts/pack-nature-assets.py --verify-manifest
          npm run check
          BUILD
          sudo env PATH="$PATH" unshare --net bash /tmp/lp-offline-build.sh
      - name: Stage complete public site
        run: |
          mkdir -p work/complete-site
          rsync -a --exclude='_site' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='functions' --exclude='firebase-debug.log' --exclude='src' --exclude='tests' --exclude='modules/math-mission-map/v11/qa' --exclude='docs' --exclude='qa' --exclude='science-curriculum-preview.html' --exclude='nature-planet-preview.html' --exclude='*.check.mjs' --exclude='*.test.mjs' source/ work/complete-site/
          mkdir -p work/complete-site/src
          cp source/src/firebase-config.js work/complete-site/src/firebase-config.js
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('work/complete-site/index.html');html=p.read_text();token='97690c088436400287798663727583b5'
          snippet="""<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "97690c088436400287798663727583b5"}'></script><!-- End Cloudflare Web Analytics -->"""
          if token not in html:
              html=html.replace('</body>',snippet+'\n</body>',1) if '</body>' in html else html+'\n'+snippet+'\n'
              p.write_text(html)
          PYTHON
      - name: Split and verify isolated app unit
        run: |
          python3 tools/two-pages-stage.py work/complete-site work/two-sites
          python3 - <<'PYTHON'
          import pathlib,json,re
          p=pathlib.Path('work/two-sites');r=json.loads((p/'split-report.json').read_text())
          if r['app']['bytes']>=1000000000 or r['assets']['bytes']!=989471212:raise SystemExit('Size or published asset identity budget mismatch')
          for f in (p/'app').rglob('*'):
              if f.is_file() and f.suffix in {'.json','.js','.mjs','.html','.md','.txt'}:
                  s=f.read_text(errors='replace')
                  if re.search(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|"type"\s*:\s*"service_account"|gh[pousr]_[A-Za-z0-9]{30,}',s):raise SystemExit('Potential credential rejected')
          print(json.dumps({'app':r['app'],'assets':r['assets'],'originalSiteChanged':False,'firebaseDeployments':0}))
          PYTHON
      - name: Read current public rollback artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 44300859460
          github-token: ${{ github.token }}
          path: rollback-download
      - name: Read published split inventory
        uses: actions/download-artifact@v4
        with:
          name: preview-integrity
          run-id: 44300859460
          github-token: ${{ github.token }}
          path: prior-integrity
      - name: Verify exact current baseline and rollback
        run: python3 isolation-ci/tests/verify_candidate.py baseline
      - name: Retain verified rollback without deploying
        uses: actions/upload-artifact@v4
        with:
          name: verified-rollback-pages
          path: rollback-download
          retention-days: 7
          compression-level: 0
      - name: Generate isolated candidate from exact split baseline
        run: python3 isolation-ci/tests/verify_candidate.py candidate
      - name: Build pinned official test container
        run: docker build -t lp-isolation-tests isolation-ci
      - name: Test exact candidate bytes with no transport egress
        run: |
          mkdir -p results/exact
          docker run --rm --network none --shm-size=1g -e QA_EXACT_ARTIFACT=1 -e QA_RESULTS=/results -v "$PWD/isolation-ci:/tests:ro" -v "$PWD/candidate-site:/source:ro" -v "$PWD/work/two-sites/assets:/assets:ro" -v "$PWD/results/exact:/results" lp-isolation-tests python /tests/tests/ui_offline_qa.py
          docker run --rm --network none --shm-size=1g -e QA_EXACT_ARTIFACT=1 -e QA_RESULTS=/results -v "$PWD/isolation-ci:/tests:ro" -v "$PWD/candidate-site:/source:ro" -v "$PWD/work/two-sites/assets:/assets:ro" -v "$PWD/results/exact:/results" lp-isolation-tests python /tests/tests/route_shell_qa.py
          tar -cf candidate-site.tar -C candidate-site .
          sha256sum candidate-site.tar > verification/candidate-tar.sha256
      - name: Retain tested candidate only after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: tested-isolated-candidate-NOT-DEPLOYED
          path: candidate-site.tar
          retention-days: 7
          compression-level: 0
      - name: Retain audit including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-audit
          path: |
            verification
            results
          retention-days: 7

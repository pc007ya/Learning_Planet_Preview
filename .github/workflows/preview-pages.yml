name: Publish isolated map preview
on:
  push:
    branches: [main]
    paths: [".github/workflows/preview-pages.yml"]
permissions:
  contents: read
concurrency:
  group: preview-pages
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'pc007ya/Learning_Planet_Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the immutable verified artifact by ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pc007ya/Learning_Planet_Preview
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14583015046" > artifact.json
          jq -e '.id == 14583015046 and .expired == false and .workflow_run.id == 44630999410 and .workflow_run.head_sha == "75544a8f89142790b412f189be2bcbdfb5796620" and .digest == "sha256:6c0c546fb70b1a80764979947a1ab449fd90c8b97c861bc366e1d6032c98fa83"' artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44630999410" --jq '.conclusion' | grep -Fx success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14583015046/zip" > evidence.zip
          echo '6c0c546fb70b1a80764979947a1ab449fd90c8b97c861bc366e1d6032c98fa83  evidence.zip' | sha256sum -c -
          mkdir evidence
          unzip -q evidence.zip -d evidence
      - name: Verify every source file before extraction
        run: |
          set -euo pipefail
          TAR=evidence/candidate-app-NOT-DEPLOYED.tar
          python3 qa/preview-publish/verify_tar.py "$TAR" evidence/verification/candidate-app-inventory.json \
            --tar-sha256 9bc22144efa2f829e21c08caa633874c9f2b1384dc031f0ac260fac8c9e7eccf \
            --tree-sha256 7d4e8989d4aacf015a445eabab2ca40e24ecbebc1df0b7a70e32d4047212a06b
          mkdir -p candidate-source
          tar --extract --file "$TAR" --directory candidate-source --no-same-owner --no-same-permissions
      - name: Construct and verify the versioned public preview
        run: |
          set -euo pipefail
          node --test qa/preview-publish/handoff.test.mjs
          python3 qa/preview-publish/stage.py candidate-source evidence/verification/candidate-app-inventory.json pages | tee release-receipt.json
          jq -e '.files == 5606 and .bytes == 995254938 and .inventory_sha256 == "46bb6b68beb063e906a3ce28e6e920bc9384df07a866ae523e4cb391ef339aa2" and .legacy_allowlisted_images_served_at_root == 0' release-receipt.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published preview URLs, not production
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test "${PAGE_URL%/}" = https://pc007ya.github.io/Learning_Planet_Preview
          base="${PAGE_URL%/}"
          curl -fsS --retry 5 --retry-all-errors --max-time 30 "$base/v2/maps-preview/index.html?release=$GITHUB_SHA" -o map-index.html
          grep -F '僅地圖驗收，不登入、不寫入進度' map-index.html
          curl -fsS --retry 5 --retry-all-errors --max-time 30 "$base/v2/index.html?release=$GITHUB_SHA" -o app-index.html
          grep -F 'entry-image-progress.js' app-index.html >/dev/null
          curl -fsS --retry 5 --retry-all-errors --max-time 30 "$base/entry-image-cache-sw.js?release=$GITHUB_SHA" -o worker.js
          grep -F 'skipWaiting' worker.js >/dev/null
          ! grep -Eq "indexedDB|respondWith|importScripts" worker.js

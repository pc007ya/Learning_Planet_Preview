name: Publish isolated map preview R9
on:
  push:
    branches: [main]
    paths: [".github/workflows/preview-pages.yml"]
permissions:
  contents: read
concurrency:
  group: preview-pages
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'pc007ya/Learning_Planet_Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the immutable verified artifact by ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pc007ya/Learning_Planet_Preview
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14583015046" > artifact.json
          jq -e '.id == 14583015046 and .expired == false and .workflow_run.id == 44630999410 and .workflow_run.head_sha == "75544a8f89142790b412f189be2bcbdfb5796620" and .digest == "sha256:6c0c546fb70b1a80764979947a1ab449fd90c8b97c861bc366e1d6032c98fa83"' artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44630999410" --jq '.conclusion' | grep -Fx success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14583015046/zip" > evidence.zip
          echo '6c0c546fb70b1a80764979947a1ab449fd90c8b97c861bc366e1d6032c98fa83  evidence.zip' | sha256sum -c -
          mkdir evidence
          unzip -q evidence.zip -d evidence
      - name: Verify every source file before extraction
        run: |
          set -euo pipefail
          TAR=evidence/candidate-app-NOT-DEPLOYED.tar
          python3 qa/preview-publish/verify_tar.py "$TAR" evidence/verification/candidate-app-inventory.json \
            --tar-sha256 9bc22144efa2f829e21c08caa633874c9f2b1384dc031f0ac260fac8c9e7eccf \
            --tree-sha256 7d4e8989d4aacf015a445eabab2ca40e24ecbebc1df0b7a70e32d4047212a06b
          mkdir -p candidate-source
          tar --extract --file "$TAR" --directory candidate-source --no-same-owner --no-same-permissions
      - name: Construct and verify the versioned public preview
        run: |
          set -euo pipefail
          node --test qa/preview-publish/handoff.test.mjs
          python3 qa/preview-publish/stage.py candidate-source evidence/verification/candidate-app-inventory.json pages | tee release-receipt.json
          jq -e '.files == 5606 and .bytes == 995254938 and .inventory_sha256 == "46bb6b68beb063e906a3ce28e6e920bc9384df07a866ae523e4cb391ef339aa2" and .legacy_allowlisted_images_served_at_root == 0' release-receipt.json
      - name: Add the isolated R3 acceptance slice without replacing existing files
        run: |
          set -euo pipefail
          python3 qa/maps-r3/stage-overlay.py pages qa/maps-r3/overlay
          for f in $(find qa/maps-r3/overlay -name '*.mjs'); do node --check "$f"; done
          node --test qa/maps-r3/tests/frame-meter.test.mjs
          for grade in {1..6}; do node qa/maps-r3/tests/english-road.test.mjs "$grade"; done
      - name: Add and test the separate R4 acceptance slice
        run: |
          set -euo pipefail
          python3 qa/maps-r4/stage-overlay.py pages qa/maps-r4/overlay 995363859
          for f in $(find qa/maps-r4/overlay -name '*.mjs'); do node --check "$f"; done
          node --test qa/maps-r4/tests/frame-meter.test.mjs
          node qa/maps-r4/tests/english-footprint.mjs
          for grade in {1..6}; do node qa/maps-r4/tests/english-road.test.mjs "$grade"; done
      - name: Add and test the separate R5 acceptance slice
        run: |
          set -euo pipefail
          python3 qa/maps-r5/stage-overlay.py pages qa/maps-r5/overlay 995483815
          for f in $(find qa/maps-r5/overlay -name '*.mjs'); do node --check "$f"; done
          node --test qa/maps-r5/tests/frame-meter.test.mjs
          node qa/maps-r5/tests/english-footprint.mjs
          for grade in {1..6}; do node qa/maps-r5/tests/english-road.test.mjs "$grade"; done
      - name: Add and test the separate R6 acceptance slice
        run: |
          set -euo pipefail
          python3 qa/maps-r6/stage-overlay.py pages qa/maps-r6/overlay 995610788
          for f in $(find qa/maps-r6/overlay -name '*.mjs'); do node --check "$f"; done
          node --test qa/maps-r6/tests/frame-meter.test.mjs
          node qa/maps-r6/tests/english-footprint.mjs
          for grade in {1..6}; do node qa/maps-r6/tests/english-road.test.mjs "$grade"; done
          node qa/maps-r6/tests/dynamic-turns.mjs
          node qa/maps-r6/tests/corner-shoulders.mjs
          node qa/maps-r6/tests/chinese-graph-test.mjs
          node qa/maps-r6/tests/chinese-runtime-test.mjs
      - name: Add and test the separate R7 acceptance slice
        run: |
          set -euo pipefail
          python3 qa/maps-r7/stage-overlay.py pages qa/maps-r7/overlay 995753043
          for f in $(find qa/maps-r7/overlay -name '*.mjs'); do node --check "$f"; done
          node --test qa/maps-r7/tests/frame-meter.test.mjs
          node qa/maps-r7/tests/english-footprint.mjs
          for grade in {1..6}; do node qa/maps-r7/tests/english-road.test.mjs "$grade"; done
          node qa/maps-r7/tests/dynamic-turns.mjs
          node qa/maps-r7/tests/corner-shoulders.mjs
          node qa/maps-r7/tests/chinese-graph-test.mjs
          node qa/maps-r7/tests/chinese-runtime-test.mjs
          node qa/maps-r7/tests/chinese-framing.mjs
          node qa/maps-r7/tests/landmark-structure.mjs
          node qa/maps-r7/tests/southeast-fringe.mjs
      - name: Add and test the separate R8 acceptance slice
        run: |
          set -euo pipefail
          python3 qa/maps-r8/stage-overlay.py pages qa/maps-r8/overlay 995907663
          for f in $(find qa/maps-r8/overlay -name '*.mjs'); do node --check "$f"; done
          node qa/maps-r8/tests/english-footprint.mjs
          for grade in {1..6}; do node qa/maps-r8/tests/english-road.test.mjs "$grade"; done
          node qa/maps-r8/tests/exact-waypoints.mjs
          node qa/maps-r8/tests/visual.mjs
      - name: Add and test the separate R9 landmarks preview
        run: |
          set -euo pipefail
          python3 qa/maps-r9/stage-overlay.py pages qa/maps-r9/overlay 995974489
          find qa/maps-r9/overlay -name '*.mjs' -exec node --check {} \;
          bash qa/maps-r9/run-tests.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every published R3 through R9 byte on the GitHub Pages preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test "${PAGE_URL%/}" = https://pc007ya.github.io/Learning_Planet_Preview
          while IFS= read -r -d '' file; do
            rel="${file#*/overlay/}"
            curl -fsS --retry 4 --retry-all-errors --max-time 25 "${PAGE_URL%/}/$rel?v=$GITHUB_SHA" -o live-r3
            cmp "$file" live-r3
          done < <(find qa/maps-r3/overlay qa/maps-r4/overlay qa/maps-r5/overlay qa/maps-r6/overlay qa/maps-r7/overlay qa/maps-r8/overlay qa/maps-r9/overlay -type f -print0)
          curl -fsS --retry 4 --retry-all-errors --max-time 25 "${PAGE_URL%/}/v2/maps-preview/viewer.mjs?v=$GITHUB_SHA" -o live-v2
          echo '8f3f9465571f4db596c72d62eb4b0d6b88e467c7cc87cf016a70273b1e6257d2  live-v2' | sha256sum -c -

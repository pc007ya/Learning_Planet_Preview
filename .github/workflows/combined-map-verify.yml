name: Combined map preview evidence (not deployed)
on:
  workflow_dispatch:
  push:
    branches: [qa/combined-map-evidence]
    paths: [.github/workflows/combined-map-verify.yml, qa/combined-maps/**]

permissions:
  contents: read

concurrency:
  group: combined-map-evidence
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'pc007ya/Learning_Planet_Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pc007ya/Learning_Planet
          ref: bcf984f7b4a6d370e5ec6786639e51e169ff6b5b
          path: combined-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pc007ya/Learning_Planet_Preview
          ref: c486b246f79d80d01320c915ec6fcb458c1ea153
          path: combined-isolation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Decode and hash public pinned candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-work/{input,vendor,verification}
          for src in qa/combined-maps/inputs/*.gz.b64; do
            dst="$(basename "${src%.gz.b64}")"
            base64 -d "$src" | gzip -dc > "combined-work/input/$dst"
          done
          cd combined-work/input
          sha256sum -c ../../qa/combined-maps/inputs/SHA256SUMS
      - name: Download locked build dependencies without lifecycle scripts
        working-directory: combined-source
        run: npm ci --ignore-scripts
      - name: Fetch only the three existing pinned public browser vendor assets
        run: python3 qa/combined-maps/tools/read_vendor.py combined-source combined-work/vendor --download
      - name: Rebuild and check under an empty route table
        run: |
          sudo env PATH="$PATH" unshare --net bash qa/combined-maps/build-offline.sh
      - name: Retain immutable non-deployable candidate and receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-candidate-NOT-DEPLOYED-${{ github.sha }}
          path: |
            combined-work/candidate-app-NOT-DEPLOYED.tar
            combined-work/verification/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain audit on gated failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-combined-static-audit-${{ github.sha }}
          path: combined-work/verification/
          if-no-files-found: ignore
          retention-days: 7

name: Synthetic isolation browser tests (NO DEPLOY)
on:
  push:
    branches: [ci/isolation-fixtures-20261118]
    paths:
      - isolation-ci/**
      - .github/workflows/isolation-fixtures.yml
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public test runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Offline sentinel regression tests
        run: python -m unittest discover -s isolation-ci/tests -p test_browser_harness_offline.py -v
      - name: Local synthetic fixtures only (SW blocked, external requests denied)
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: python isolation-ci/tests/browser_qa.py
      - name: Retain synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-fixtures-${{ matrix.browser }}
          path: isolation-ci/browser-results/offline-fixture-report.json
          retention-days: 7

  sw-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned official test container
        run: docker build -t lp-isolation-tests isolation-ci
      - name: Native SW and IndexedDB with no transport egress
        run: |
          status=0
          for browser in chromium webkit; do
            mkdir -p "results/sw-$browser"
            docker run --rm --network none --shm-size=1g -e QA_BROWSER="$browser" -e QA_RESULTS=/results -v "$PWD/isolation-ci:/tests:ro" -v "$PWD/results/sw-$browser:/results" lp-isolation-tests python /tests/tests/sw_offline_qa.py || status=1
          done
          mkdir -p results/sw-webkit-ephemeral
          docker run --rm --network none --shm-size=1g -e QA_RESULTS=/results -v "$PWD/isolation-ci:/tests:ro" -v "$PWD/results/sw-webkit-ephemeral:/results" lp-isolation-tests python /tests/tests/webkit_ephemeral_qa.py || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-native-offline
          path: results
          retention-days: 7
  actual-ui-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pc007ya/Learning_Planet
          ref: 0e39222ba892fbc823a884bad636cfb484501169
          path: source
          persist-credentials: false
      - name: Prepare isolated candidate and verified public runtime libraries
        run: |
          python3 isolation-ci/build-overlay.py source
          python3 isolation-ci/tests/prepare_ui.py
      - name: Build pinned official test container
        run: docker build -t lp-isolation-tests isolation-ci
      - name: Actual app smoke with no transport egress and synthetic DEMO only
        run: |
          mkdir -p results/ui
          docker run --rm --network none --shm-size=1g -e QA_RESULTS=/results -v "$PWD/isolation-ci:/tests:ro" -v "$PWD/source:/source:ro" -v "$PWD/results/ui:/results" lp-isolation-tests python /tests/tests/ui_offline_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-ui-offline
          path: results
          retention-days: 7
